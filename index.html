<script>
    
    // ============================================
    // Копирование IP-адреса сервера
    // ============================================
    async function copyIP(event) {
      const ip = document.getElementById('serverIp').innerText;
      const btn = event.target.closest('.copy-btn');
      const originalHTML = btn.innerHTML;
      
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(ip);
          showCopySuccess(btn, originalHTML);
          return;
        } catch (err) {
          console.log('Clipboard API failed, falling back');
        }
      }
      
      // Фолбэк для HTTP
      const textarea = document.createElement('textarea');
      textarea.value = ip;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showCopySuccess(btn, originalHTML);
        } else {
          alert('Не удалось скопировать');
        }
      } catch (err) {
        alert('Не удалось скопировать текст');
      }
      
      document.body.removeChild(textarea);
    }
    
    function showCopySuccess(btn, originalHTML) {
      btn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
      setTimeout(() => {
        btn.innerHTML = originalHTML;
      }, 2000);
    }
    // Добавьте в ваш HTML или основной JS файл
    document.addEventListener('DOMContentLoaded', function() {
  // Создаем кнопку бургер-меню
  const menuToggle = document.createElement('button');
  menuToggle.className = 'menu-toggle';
  menuToggle.innerHTML = '☰';
  document.body.appendChild(menuToggle);
  
  // Создаем оверлей для меню
  const overlay = document.createElement('div');
  overlay.className = 'sidebar-overlay';
  document.body.appendChild(overlay);
  
  const sidebar = document.querySelector('.sidebar');
  
  // Открытие/закрытие меню
  menuToggle.addEventListener('click', function() {
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('active');
    menuToggle.innerHTML = sidebar.classList.contains('mobile-open') ? '✕' : '☰';
  });
  
  // Закрытие меню при клике на оверлей
  overlay.addEventListener('click', function() {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('active');
    menuToggle.innerHTML = '☰';
  });
  
  // Закрытие меню при клике на пункт меню
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', function() {
      if (window.innerWidth <= 768) {
        sidebar.classList.remove('mobile-open');
        overlay.classList.remove('active');
        menuToggle.innerHTML = '☰';
      }
    });
  });
  
  // Автоматическое закрытие меню при изменении размера окна
  window.addEventListener('resize', function() {
    if (window.innerWidth > 768) {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
      menuToggle.innerHTML = '☰';
    }
  });
});
</script>

<script>
// ============================================
// Проверка авторизации и обновление интерфейса
// ============================================
async function checkAuthAndUpdateUI() {
  try {
    const response = await fetch('/api/check-auth.php', {
      credentials: 'include'
    });
    const data = await response.json();
    
    if (data.authenticated) {
      showPrivateElements();
      console.log('Привет, ' + data.user.minecraft_nick);
    } else {
      showGuestElements();
    }

    window.__isAuthenticated = data.authenticated;
    window.__userData = data.user || null;
    
  } catch(e) {
    console.error('Ошибка проверки авторизации', e);
    showGuestElements();
    window.__isAuthenticated = false;
    window.__userData = null;
  }
}

function showPrivateElements() {
  document.querySelectorAll('.nav-private').forEach(el => el.style.display = '');
  document.querySelectorAll('.nav-guest').forEach(el => el.style.display = 'none');
}

function showGuestElements() {
  document.querySelectorAll('.nav-private').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.nav-guest').forEach(el => el.style.display = '');
}

function logout() {
  fetch('/api/logout.php', { method: 'POST', credentials: 'include' })
    .then(() => window.location.href = '/login.html')
    .catch(() => window.location.href = '/login.html');
}

// Запускаем при загрузке
checkAuthAndUpdateUI();
</script>
